<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zé Meia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow:  #FFD600;
      --yellow2: #FFA800;
      --dark:    #0f0f0f;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border:  rgba(255, 214, 0, 0.2);
    }

    html, body { min-height: 100%; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--dark);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px 60px;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Fundo ── */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      pointer-events: none;
      animation: float 9s ease-in-out infinite alternate;
    }
    .bg-orb.o1 { width: 500px; height: 500px; background: var(--yellow);  top: -150px; left: -150px; animation-duration: 10s; }
    .bg-orb.o2 { width: 350px; height: 350px; background: var(--yellow2); bottom: -80px; right: -80px; animation-duration: 13s; }
    .bg-orb.o3 { width: 200px; height: 200px; background: #fff;           top: 50%;  left: 55%;  opacity: 0.05; animation-duration: 7s; }

    @keyframes float {
      from { transform: translateY(0)    scale(1); }
      to   { transform: translateY(-40px) scale(1.1); }
    }

    /* ── Partículas ── */
    .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .particle  { position: absolute; border-radius: 50%; opacity: 0; animation: rise linear infinite; }
    @keyframes rise {
      0%   { transform: translateY(0)       scale(1);   opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-110vh) scale(0.4); opacity: 0; }
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Avatar ── */
    .avatar-wrap { position: relative; margin-bottom: 22px; }

    .avatar-ring {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      padding: 3px;
      background: conic-gradient(var(--yellow), var(--yellow2), #fff, var(--yellow));
      animation: spin-ring 3s linear infinite;
    }

    @keyframes spin-ring { to { transform: rotate(360deg); } }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--dark);
      background: #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      border-radius: 50%;
    }

    /* Fallback emoji se a imagem não carregar */
    .avatar-inner .emoji-fallback {
      font-size: 56px;
      line-height: 1;
    }

    .avatar-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: #25D366;
      border: 3px solid var(--dark);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(37,211,102,0.6);
    }

    /* ── Texto do perfil ── */
    .profile-name {
      font-size: 2.6rem;
      font-weight: 900;
      font-style: italic;
      color: var(--yellow);
      letter-spacing: -1px;
      text-align: center;
      line-height: 1;
      margin-bottom: 4px;
      text-shadow: 0 0 40px rgba(255,214,0,0.4);
    }

    .profile-handle {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 8px;
      letter-spacing: 1.5px;
    }

    .profile-bio {
      font-size: 0.97rem;
      color: rgba(255,255,255,0.65);
      text-align: center;
      max-width: 300px;
      line-height: 1.55;
      margin-bottom: 28px;
    }

    /* ── Divisor ── */
    .divider {
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, var(--yellow), var(--yellow2));
      border-radius: 99px;
      margin-bottom: 28px;
    }

    /* ── Seção label ── */
    .section-label {
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ── Botões ── */
    .links { display: flex; flex-direction: column; gap: 12px; width: 100%; }

    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      font-weight: 900;
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    .link-btn:hover {
      transform: translateY(-4px) scale(1.025);
      border-color: rgba(255,214,0,0.45);
    }
    .link-btn:active { transform: scale(0.97); }

    /* TikTok */
    .btn-tiktok::before { background: linear-gradient(120deg, #010101 0%, #010101 30%, #69c9d0 70%, #ee1d52 100%); }
    .btn-tiktok:hover::before { opacity: 1; }
    .btn-tiktok:hover { box-shadow: 0 10px 35px rgba(238,29,82,0.35); }

    /* YouTube */
    .btn-youtube::before { background: linear-gradient(120deg, #1a0000 0%, #c4302b 50%, #ff6b6b 100%); }
    .btn-youtube:hover::before { opacity: 1; }
    .btn-youtube:hover { box-shadow: 0 10px 35px rgba(255,0,0,0.35); }

    /* Facebook */
    .btn-facebook::before { background: linear-gradient(120deg, #0a1628 0%, #1877F2 60%, #42a5f5 100%); }
    .btn-facebook:hover::before { opacity: 1; }
    .btn-facebook:hover { box-shadow: 0 10px 35px rgba(24,119,242,0.35); }

    /* Instagram */
    .btn-instagram::before { background: linear-gradient(120deg, #405de6 0%, #833ab4 25%, #c13584 50%, #e1306c 75%, #fd1d1d 100%); }
    .btn-instagram:hover::before { opacity: 1; }
    .btn-instagram:hover { box-shadow: 0 10px 35px rgba(193,53,132,0.4); }

    /* Email */
    .btn-email::before { background: linear-gradient(120deg, #0d0d0d 0%, #444 50%, #888 100%); }
    .btn-email:hover::before { opacity: 1; }
    .btn-email:hover { box-shadow: 0 10px 35px rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

    /* ── Ícone ── */
    .btn-icon {
      position: relative;
      z-index: 1;
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(255,255,255,0.08);
    }
    .btn-icon svg { width: 24px; height: 24px; }

    /* ── Texto do botão ── */
    .btn-text { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 1px; }
    .btn-label { font-size: 1rem; font-weight: 900; }
    .btn-sub   { font-size: 0.76rem; font-weight: 400; color: rgba(255,255,255,0.5); }

    /* ── Seta ── */
    .btn-arrow {
      position: relative;
      z-index: 1;
      margin-left: auto;
      opacity: 0.4;
      font-size: 1.1rem;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    .link-btn:hover .btn-arrow { transform: translateX(5px); opacity: 1; }

    /* ── Rodapé ── */
    .footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.18);
      text-align: center;
      letter-spacing: 1px;
    }
    .footer span { color: var(--yellow); opacity: 0.5; }

    /* ── Ripple ── */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 214, 0, 0.2);
      transform: scale(0);
      animation: ripple-anim 0.55s linear;
      pointer-events: none;
    }
    @keyframes ripple-anim { to { transform: scale(5); opacity: 0; } }
  </style>
</head>
<body>

  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>
  <div class="particles" id="particles"></div>

    <!-- Avatar -->

    <div class="divider"></div>

    <!-- Links -->

      <!-- TikTok -->

      <!-- YouTube -->

        </div>
        <span class="btn-arrow">→</span>
      </a>

      <!-- Instagram -->
      <a class="link-btn btn-instagram"

        <div class="btn-icon">
          <svg viewBox="0 0 24 24" fill="white"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>

      </a>

      <a class="link-btn btn-facebook"

      <!-- Email -->

    </div>

    <p class="footer">© 2026 <span>Zé Meia</span> · feito com muito 🧦</p>
  </div>

  <script>
    // Partículas amarelas
    const container = document.getElementById('particles');
    const colors = ['#FFD600', '#FFA800', '#fff', '#FFE566', '#FF6B00'];

    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 5 + 2;
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        bottom: -10px;
        width: ${size}px;
        height: ${size}px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        animation-duration: ${Math.random() * 14 + 8}s;
        animation-delay: ${Math.random() * 12}s;
        border-radius: ${Math.random() > 0.5 ? '50%' : '3px'};
      `;
      container.appendChild(p);
    }

    // Ripple nos botões
    document.querySelectorAll('.link-btn').forEach(btn => {
      btn.addEventListener('click', function (e) {
        const rect = this.getBoundingClientRect();
        const r = document.createElement('span');
        r.className = 'ripple';
        const size = Math.max(rect.width, rect.height);
        r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size/2}px;top:${e.clientY - rect.top - size/2}px;`;
        this.appendChild(r);
        setTimeout(() => r.remove(), 600);
      });
    });
  </script>
</body>
</html>
